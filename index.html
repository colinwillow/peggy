<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + the safe-area insets in the CSS is what keeps the
     sticks clear of the home indicator and the notch on a real phone. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Peggy">
<title>Peggy</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- The home-screen icon. iOS reads apple-touch-icon, NOT the manifest, and it
     masks the corners itself — so these are full-bleed art with no baked-in
     rounding (baked corners would show as black inside Apple's mask).
     Regenerate every size from icons/icon-source-1254.png if the art changes. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="game"></canvas>

<!-- ── TOUCH CONTROLS ──────────────────────────────────────────────────────
     Two invisible half-screen zones. The visible ring and knob are moved to
     wherever the thumb lands, so there is nothing to aim for and nothing to
     look at. The buttons sit above the sticks, out of thumb-sweep range. -->
<div id="zone-left" class="stick-zone"></div>
<div id="zone-right" class="stick-zone"></div>
<div id="ring-left" class="stick-ring left"></div>
<div id="knob-left" class="stick-knob left"></div>
<div id="ring-right" class="stick-ring right"></div>
<div id="knob-right" class="stick-knob right"></div>

<!-- ── CONTEXT PROMPT ──────────────────────────────────────────────────────
     Rides on top of the RIGHT stick, because interact and jump are the same
     input. When something is in range the stick grows a flashing ring and the
     icon of the thing, so the player learns the verb from the stick itself
     rather than from a tutorial line. -->
<div id="prompt" class="hidden">
  <div class="prompt-ring"></div>
  <div class="prompt-disc">
    <svg class="prompt-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chest"></use></svg>
  </div>
  <div class="prompt-label">OPEN</div>
</div>

<!-- icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chest" viewBox="0 0 24 24">
    <path d="M3 11h18v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="currentColor" opacity=".55"/>
    <path d="M3 11a9 9 0 0 1 18 0z" fill="currentColor"/>
    <rect x="10.4" y="9.4" width="3.2" height="5" rx=".7" fill="currentColor"/>
    <rect x="10.9" y="11.2" width="2.2" height="2.4" rx=".5" fill="#1a0f26"/>
  </symbol>
  <symbol id="i-door" viewBox="0 0 24 24">
    <path d="M6 21V6a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v15z" fill="currentColor" opacity=".55"/>
    <path d="M6 21V6a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v15z" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <circle cx="14.8" cy="12.6" r="1.15" fill="currentColor"/>
  </symbol>
  <symbol id="i-wheel" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="6.4" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="12" cy="12" r="1.9" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M12 1.8v4M12 18.2v4M1.8 12h4M18.2 12h4"/>
      <path d="M4.8 4.8l2.8 2.8M16.4 16.4l2.8 2.8M19.2 4.8l-2.8 2.8M7.6 16.4l-2.8 2.8"/>
    </g>
  </symbol>
</svg>

<div id="reticle"></div>

<!-- ── HUD ─────────────────────────────────────────────────────────────── -->
<div id="hud">
  <div id="hud-left">
    <span id="hud-state">—</span>
    <span id="hud-speed">0.0 m/s</span>
    <span id="hud-fps">— fps</span>
    <span id="hud-gesture">—</span>
    <span id="hud-gold-wrap">&#9679; <span id="hud-gold">0</span></span>
  </div>
  <div id="hud-hint"></div>
</div>

<div id="controls-legend">
  <div class="legend-touch">
    <b>LEFT</b> move · tap centre camera · flick down dive<br>
    <b>RIGHT</b> turn · tap jump ×2 · flick combo · hold to aim the hook
  </div>
  <div class="legend-kbm">
    <b>WASD</b> move · <b>SPACE</b> jump ×2 · <b>V</b>/click combo · <b>F</b> hook · <b>C</b> dive<br>
    <b>Q</b>/<b>E</b> turn camera · <b>R</b> centre camera
  </div>
</div>

<!-- ── TITLE ───────────────────────────────────────────────────────────
     The logo is a processed alpha sticker (letters carved from the painting,
     shadow baked in — see styles.css). Behind it the 2D cartoon vignette
     renders in place of the world until the first tap. -->
<img id="title-logo" src="images/title-logo.webp" alt="PEGGY">
<div id="title" class="hidden">
  <div id="title-fade"></div>
  <div id="title-prompt">tap to set sail</div>
</div>

<!-- ── BOOT ────────────────────────────────────────────────────────────── -->
<div id="boot">
  <div class="boot-inner">
    <img class="boot-logo" src="images/title-logo.webp" alt="PEGGY">
    <div class="boot-skull">☠</div>
    <p>hoisting the colours…</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
